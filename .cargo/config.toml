# Faster linking with mold (apt package: `mold`).
# We pass -fuse-ld=mold to rustc's linker driver; the system `cc` then
# delegates the actual link to mold. The `ld.mold` symlink in /usr/bin
# (provided by the apt package) is what makes this resolve.
[target.x86_64-unknown-linux-gnu]
# Flatcar (this host) doesn't have mold; use default ld.
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]

[target.aarch64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=mold"]
